<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kristian Colville — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio site for Kristian Colville, software engineer — projects, experience, certifications and contact details."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the stored theme before first paint so a saved dark preference never flashes white. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        /* default stays light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
