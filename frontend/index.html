<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kristian Colville — Software Engineer</title>
    <meta
      name="description"
      content="Full-stack software engineer in Ireland building AV streaming and recording infrastructure — React and Node.js front to back, Linux and WebRTC underneath. Projects, experience and certifications."
    />
    <meta name="author" content="Kristian Colville" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Open Graph / social previews. og:url and og:image must be ABSOLUTE for
         LinkedIn, Slack and X to resolve them, so VITE_SITE_URL is injected at
         build time — the deploy workflow fails rather than shipping these blank. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kristian Colville" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Kristian Colville — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack software engineer in Ireland turning messy technical problems into reliable systems."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kristian Colville — Software Engineer, Ireland" />
    <meta property="og:locale" content="en_IE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kristian Colville — Software Engineer" />
    <meta
      name="twitter:description"
      content="Full-stack software engineer in Ireland turning messy technical problems into reliable systems."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/images/og-card.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the stored theme before first paint so a saved dark preference never flashes white. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        /* default stays light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
